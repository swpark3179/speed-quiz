name: Deploy

# 수동 실행 전용 (Actions 탭 → Deploy → "Run workflow"). push/PR 등 자동 트리거 없음.
# 서버에 설치된 self-hosted runner 에서 직접 실행되므로 SSH·인바운드 방화벽이 필요 없다.
on:
  workflow_dispatch:

# 동시에 두 번 배포되지 않도록 직렬화 (진행 중인 배포는 취소하지 않음)
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, linux]
    timeout-minutes: 15
    steps:
      # _work 폴더에 체크아웃되는 사본은 "최신 deploy.sh 를 실행"하는 용도.
      # 실제 서비스 폴더(APP_DIR)는 deploy.sh 가 git fast-forward 로 갱신한다.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Deploy
        env:
          APP_DIR: ${{ vars.APP_DIR }}          # 비우면 러너 계정의 ~/speed-quiz
          PM2_APP: ${{ vars.PM2_APP }}          # 비우면 speed-quiz
          BRANCH: main
        run: |
          : "${APP_DIR:=$HOME/speed-quiz}"
          : "${PM2_APP:=speed-quiz}"
          export APP_DIR PM2_APP BRANCH
          bash scripts/deploy.sh
